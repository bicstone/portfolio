name: Deploy preview to Cloudflare Workers (renewal-2026)

# renewal-2026ブランチの内容を、本番に切り替えずにプレビュー用のバージョンとしてアップロードする。
# `wrangler versions upload`は本番のトラフィックを切り替えないため、本番には影響しない。
# プレビューURL: https://renewal-2026-<Worker名>.<アカウントのサブドメイン>.workers.dev

on:
  push:
    branches: [renewal-2026]
  workflow_dispatch:

concurrency:
  group: deploy-preview-to-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: deploy-to-cloudflare
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Upload preview version
        # pipefailを有効にし、wranglerの失敗をteeで握りつぶさないようにする
        shell: bash
        run: |
          pnpm exec wrangler versions upload \
            --preview-alias renewal-2026 \
            --message "${GITHUB_SHA}" \
            | tee wrangler-output.txt
          {
            echo "## Preview"
            echo
            grep -oE 'https://[^ ]+\.workers\.dev[^ ]*' wrangler-output.txt | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
