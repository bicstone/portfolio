name: Deploy to Cloudflare Workers (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-to-cloudflare
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: deploy-to-cloudflare
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT_CHECKOUT }}
          submodules: "recursive"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public
            .cache
          key: gatsby-v2-${{ github.sha }}
          restore-keys: |
            gatsby-v2-

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          GTM_ID: ${{ vars.GTM_ID }}

      - run: rm -f ./public/.git ./public/.gitignore

      - run: pnpm run cloudflare:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public
            .cache
          key: gatsby-v2-${{ github.sha }}
